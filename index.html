r\"><b id=\"ar\">&#10148;<\/b> <span id=\"ad\"><\/span><\/div>\n<div id=\"hint\"><\/div><div id=\"msg\"><\/div><canvas id=\"cc\"><\/canvas><canvas id=\"hc\"><\/canvas><div id=\"web\"><\/div><div id=\"jf\"><\/div>\n<div class=\"ov\" id=\"start\"><h1>SUBLEVEL 2<\/h1><p style=\"letter-spacing:5px;color:#c9b99b\">THE NEST<\/p>\n<p>WASD move \u00b7 SHIFT sprint (LOUD) \u00b7 MOUSE or arrow keys look<br>F flashlight \u00b7 E pick up \u00b7 HOLD E to burn<br><br>The Weaver is asleep. Walking into her webs stirs her a little, but crushing her EGGS enrages her, and then you cannot outrun her.<br>The elevator is jammed with cobwebs. Find 3 lighter fragments and 3 gas cans (they sparkle) and burn it open, but fire is LOUD and she will hear it.<br>If she wraps you, MASH SPACE: the longer you are in the silk, the more it burns you. Batteries recharge your light.<br><br>CLICK TO ENTER<\/p><\/div>\n<div class=\"ov\" id=\"dead\" style=\"display:none\"><\/div>\n<div class=\"ov\" id=\"win\" style=\"display:none\"><\/div>\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js\"><\/script>\n<script src=\"spider_model.js\"><\/script>\n<script>\n'use strict';\nconst $=id=>document.getElementById(id);\nconst N=104,CS=1.6,STEP=.32,CH=5.4,D4=[[1,0],[-1,0],[0,1],[0,-1]];\nfunction mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}\nconst R=mulberry32(7); // fixed seed = same cave every run\n\n/* ---------- CAVE GENERATION ---------- */\nconst open=new Uint8Array(N*N);\nfunction carve(cx,cz,r){const m=Math.ceil(r)+1;for(let j=-m;j<=m;j++)for(let i=-m;i<=m;i++){const x=Math.round(cx)+i,z=Math.round(cz)+j;if(x>2&&z>2&&x<N-3&&z<N-3&&(x-cx)**2+(z-cz)**2<=r*r+R()*r)open[z*N+x]=1}}\nconst WP=[[9,9],[24,15],[38,9],[58,15],[62,34],[46,41],[28,33],[15,53],[34,62],[56,58],[62,62]].map(p=>[Math.round(p[0]*N/72),Math.round(p[1]*N/72)]);\nfor(let k=0;k<WP.length-1;k++){const[a,b]=WP[k],[c,d]=WP[k+1];for(let s=0;s<=70;s++){const t=s/70;carve(a+(c-a)*t+Math.sin(t*9+k)*3,b+(d-b)*t+Math.cos(t*7+k*2)*3,1.5+R()*1.2)}carve(a,b,5)}\ncarve(WP[WP.length-1][0],WP[WP.length-1][1],5);\nconst side=[];\nfor(let k=0;k<12;k++){let[x,z]=WP[1+Math.floor(R()*(WP.length-2))],a=R()*6.28;for(let s=0;s<34;s++){a+=(R()-.5)*.7;x=Math.max(5,Math.min(N-6,x+Math.cos(a)*1.3));z=Math.max(5,Math.min(N-6,z+Math.sin(a)*1.3));carve(x,z,1.4)}carve(x,z,3.6);side.push([Math.round(x),Math.round(z)])}\n{const o2=open.slice();for(let z=3;z<N-3;z++)for(let x=3;x<N-3;x++){const i=z*N+x;let c=0;for(const[dx,dz]of D4)c+=o2[i+dz*N+dx];\n if(o2[i]&&c<4&&R()<.12)open[i]=0;else if(o2[i]&&c==4&&R()<.025)open[i]=0;else if(!o2[i]&&c>=1&&R()<.08)open[i]=1}}\n// stairs: height changes by at most 1 step between neighbouring cells, so the whole cave is walkable staircases\nconst H=(x,z)=>Math.round(8*Math.sin(x*.085+.6)+8*Math.cos(z*.075+.3)+4*Math.sin((x+z)*.05));\nconst FY=new Float32Array(N*N),CY=new Float32Array(N*N),opens=[],rocks=[];\nfor(let z=0;z<N;z++)for(let x=0;x<N;x++){const i=z*N+x;FY[i]=H(x,z)*STEP;\n if(open[i]){opens.push(i);CY[i]=FY[i]+CH+R()*1.2}\n else{let nr=0;for(let dz=-1;dz<=1;dz++)for(let dx=-1;dx<=1;dx++){const xx=x+dx,zz=z+dz;if(xx>=0&&zz>=0&&xx<N&&zz<N&&open[zz*N+xx])nr=1}if(nr)rocks.push(i)}}\nconst gAt=(x,z)=>{const i=Math.floor(x/CS),j=Math.floor(z/CS);return(i<0||j<0||i>=N||j>=N||!open[j*N+i])?null:FY[j*N+i]};\nfunction los(x0,z0,x1,z1){const n=Math.ceil(Math.hypot(x1-x0,z1-z0)/.6);for(let k=1;k<n;k++){const t=k/n;if(gAt(x0+(x1-x0)*t,z0+(z1-z0)*t)===null)return false}return true}\nfunction bfs(sx,sz,tx,tz){const s=sz*N+sx,t=tz*N+tx;if(!open[s]||!open[t])return[];const pv=new Int32Array(N*N).fill(-1);pv[s]=s;const q=[s];\n for(let h=0;h<q.length&&pv[t]<0;h++){const c=q[h],x=c%N,z=(c/N)|0;for(const[dx,dz]of D4){const nx=x+dx,nz=z+dz;if(nx<0||nz<0||nx>=N||nz>=N)continue;const n=nz*N+nx;if(open[n]&&pv[n]<0){pv[n]=c;q.push(n)}}}\n if(pv[t]<0)return[];const p=[];for(let c=t;c!==s;c=pv[c])p.push(c);return p.reverse()}\n\nconst reach=new Uint8Array(N*N);{const q=[WP[0][1]*N+WP[0][0]];reach[q[0]]=1;for(let h=0;h<q.length;h++){const c=q[h],x=c%N,z=(c/N)|0;for(const[dx,dz]of D4){const nx=x+dx,nz=z+dz;if(nx<0||nz<0||nx>=N||nz>=N)continue;const n=nz*N+nx;if(open[n]&&!reach[n]){reach[n]=1;q.push(n)}}}}   // every cell you can actually walk to from the start: items and victims only appear on these\n\n/* ---------- RENDERER / SCENE ---------- */\nconst scene=new THREE.Scene();scene.background=new THREE.Color(0x040302);scene.fog=new THREE.FogExp2(0x040302,.048);\nconst cam=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.05,120);cam.rotation.order='YXZ';scene.add(cam);\nconst ren=new THREE.WebGLRenderer({antialias:true});ren.setSize(innerWidth,innerHeight);ren.setPixelRatio(Math.min(devicePixelRatio,1.5));document.body.appendChild(ren.domElement);\naddEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});\nscene.add(new THREE.HemisphereLight(0x3a2f26,0x120d09,.55));\nconst spot=new THREE.SpotLight(0xffe2b0,3,36,.55,.55,1.2);spot.position.set(.15,-.1,0);spot.target.position.set(0,0,-1);cam.add(spot,spot.target);\n\nconst T=(()=>{const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');g.fillStyle='#9a8b78';g.fillRect(0,0,128,128);\n for(let i=0;i<1100;i++){const v=Math.random()*90|0;g.fillStyle=`rgba(${v},${v*.85|0},${v*.7|0},${Math.random()*.4})`;g.fillRect(Math.random()*128,Math.random()*128,1+Math.random()*9,1+Math.random()*4)}\n return new THREE.CanvasTexture(c)})();\nconst silk=(()=>{const c=document.createElement('canvas');c.width=c.height=512;const g=c.getContext('2d');g.fillStyle='#f1ede0';g.fillRect(0,0,512,512);   // fuzzy white silk, like a silkworm cocoon\n for(let i=0;i<7000;i++){const x=Math.random()*512,y=Math.random()*512,a=Math.random()*6.28,l=8+Math.random()*34;g.strokeStyle=Math.random()<.55?`rgba(255,255,255,${.25+Math.random()*.5})`:`rgba(150,135,100,${.04+Math.random()*.12})`;g.lineWidth=.6+Math.random()*1.2;g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke()}return c})();\nconst box=new THREE.BoxGeometry(1,1,1),mat=new THREE.MeshStandardMaterial({map:T,roughness:1}),mat2=new THREE.MeshStandardMaterial({color:0x4a4036,roughness:1,flatShading:true});\nfunction mk(arr,fn){const m=new THREE.InstancedMesh(box,mat,arr.length),d=new THREE.Object3D(),c=new THREE.Color();\n arr.forEach((i,k)=>{const x=i%N,z=(i/N)|0,[y0,y1,l]=fn(i,x,z);d.position.set((x+.5)*CS,(y0+y1)/2,(z+.5)*CS);d.scale.set(CS,y1-y0,CS);d.updateMatrix();m.setMatrixAt(k,d.matrix);m.setColorAt(k,c.setHSL(.07,.2,l))});\n m.instanceColor.needsUpdate=true;scene.add(m)}\nmk(opens,i=>[FY[i]-4,FY[i],.3+R()*.1]);                    // floor steps\nmk(opens,i=>[CY[i],CY[i]+4,.2+R()*.08]);                   // ceiling\nmk(rocks,i=>{const x=i%N,z=(i/N)|0;let lo=1e9,hi=-1e9;for(let dz=-1;dz<=1;dz++)for(let dx=-1;dx<=1;dx++){const xx=x+dx,zz=z+dz;if(xx<0||zz<0||xx>=N||zz>=N)continue;const j=zz*N+xx;if(open[j]){lo=Math.min(lo,FY[j]);hi=Math.max(hi,CY[j])}}return[lo-4,hi+3,.26+R()*.1]});\n{ // sharp rock spikes jutting out of the walls\n const UP=new THREE.Vector3(0,1,0),n=new THREE.Vector3(),L=[];for(const i of opens)for(const[dx,dz]of D4)if(!open[i+dz*N+dx]&&R()<.4)L.push([i,dx,dz]);\n const m=new THREE.InstancedMesh(new THREE.ConeGeometry(.16,1,5),new THREE.MeshStandardMaterial({color:0x9a8a74,roughness:.9,flatShading:true}),L.length),d=new THREE.Object3D();\n L.forEach(([i,dx,dz],k)=>{const x=i%N,z=(i/N)|0,len=.5+R()*.8;n.set(-dx+(R()-.5)*.8,(R()-.5)*.9,-dz+(R()-.5)*.8).normalize();\n  d.position.set((x+.5+dx*.5)*CS+dz*(R()-.5)*CS*.9,FY[i]+.3+R()*(CY[i]-FY[i]-.6),(z+.5+dz*.5)*CS+dx*(R()-.5)*CS*.9).addScaledVector(n,len/2-.12);\n  d.quaternion.setFromUnitVectors(UP,n);d.scale.set(.8+R()*.8,len,.8+R()*.8);d.updateMatrix();m.setMatrixAt(k,d.matrix)});\n scene.add(m)}\n{ // stalactites + stalagmites\n const mkc=(n,up,len)=>{const g=new THREE.ConeGeometry(.22,1,7);if(!up)g.rotateX(Math.PI);const m=new THREE.InstancedMesh(g,mat2,n),d=new THREE.Object3D();\n  for(let k=0;k<n;k++){const i=opens[R()*opens.length|0],x=i%N,z=(i/N)|0,l=len*(.4+R()*.9);d.position.set((x+R())*CS,up?FY[i]+l/2:CY[i]-l/2+.1,(z+R())*CS);d.scale.set(.8+R(),l,.8+R());d.updateMatrix();m.setMatrixAt(k,d.matrix)}scene.add(m)};\n mkc(300,false,2.2);mkc(140,true,.9)}\n\nconst eggs=[];let eggM;   // the spider's eggs: step on one and she wakes up FURIOUS\n{ // clusters of white silk eggs lying around the cave, thickest in her lair\n const m=new THREE.InstancedMesh(new THREE.SphereGeometry(.5,14,10),new THREE.MeshStandardMaterial({map:new THREE.CanvasTexture(silk),roughness:1,emissive:0x4a463c}),260),d=new THREE.Object3D();let k=0;eggM=m;\n const lx=(WP[5][0]+.5)*CS,lz=(WP[5][1]+.5)*CS;\n for(let c=0;c<64&&k<250;c++){let cx,cz;if(c<12){cx=lx+(R()-.5)*14;cz=lz+(R()-.5)*14}else if(c<32){const w=WP[1+(R()*9|0)];cx=(w[0]+(R()-.5)*10)*CS;cz=(w[1]+(R()-.5)*10)*CS}else{const i=opens[R()*opens.length|0];cx=(i%N+.5)*CS;cz=((i/N|0)+.5)*CS}\n  if(gAt(cx,cz)===null||Math.hypot(cx-(WP[0][0]+.5)*CS,cz-(WP[0][1]+.5)*CS)<9)continue;\n  for(let j=0,n=3+(R()*3|0);j<n;j++){const x=cx+(R()-.5)*1.6,z=cz+(R()-.5)*1.6,g=gAt(x,z);if(g===null)continue;\n   d.position.set(x,g+.22,z);d.rotation.set((R()-.5)*.5,R()*6.28,(R()-.5)*.5);d.scale.set(.42+R()*.18,.38+R()*.1,.78+R()*.3);d.updateMatrix();eggs.push({x,z,y:g,k,dead:0});m.setMatrixAt(k++,d.matrix)}}\n m.count=k;scene.add(m)}\n\n{ // the Weaver's past victims: man-sized silk cocoons hanging, propped and lying everywhere\n const Z=new THREE.Vector3(0,0,1),vm=new THREE.MeshStandardMaterial({map:new THREE.CanvasTexture(silk),color:0xe4dcc4,roughness:1,emissive:0x3a362c}),\n  bodyM=new THREE.InstancedMesh(new THREE.SphereGeometry(.5,16,12),vm,140),headM=new THREE.InstancedMesh(new THREE.SphereGeometry(.5,12,10),vm,140),\n  ropeM=new THREE.InstancedMesh(new THREE.CylinderGeometry(.012,.012,1,5),new THREE.MeshStandardMaterial({color:0xcfc8b4,roughness:1,emissive:0x2a2820}),140),\n  q=new THREE.Quaternion(),a=new THREE.Vector3(),p=new THREE.Vector3(),hp=new THREE.Vector3(),m4=new THREE.Matrix4(),sc=new THREE.Vector3();let k=0,ropes=0;\n const put=(px,py,pz,ax,ay,az,rope)=>{p.set(px,py,pz);a.set(ax,ay,az).normalize();q.setFromUnitVectors(Z,a);\n  m4.compose(p,q,sc.set(.78,.7,1.9));bodyM.setMatrixAt(k,m4);                                            // body\n  hp.set(0,0,.88).applyQuaternion(q).add(p);m4.compose(hp,q,sc.set(.56,.54,.6));headM.setMatrixAt(k,m4);k++;   // head bulge\n  if(rope>0){m4.compose(p.set(px,py+.95+rope/2,pz),q.identity(),sc.set(1,rope,1));ropeM.setMatrixAt(ropes++,m4)}};   // silk thread to the ceiling\n for(let t=0,made=0;made<120&&t<900;t++){const i=opens[R()*opens.length|0];if(!reach[i])continue;const x=i%N,z=(i/N)|0,cx=(x+R())*CS,cz=(z+R())*CS,kind=R();\n  if(Math.hypot(cx-(WP[0][0]+.5)*CS,cz-(WP[0][1]+.5)*CS)<7)continue;\n  if(kind<.3){const cy=Math.min(CY[i]-1.3,FY[i]+3.1+R()*.5);put(cx,cy,cz,(R()-.5)*.12,1,(R()-.5)*.12,CY[i]-(cy+.95));made++}   // hanging above your head\n  else{const ds=D4.filter(([dx,dz])=>!open[i+dz*N+dx]);if(!ds.length)continue;const[dx,dz]=ds[R()*ds.length|0],fx=(x+.5+dx*.5)*CS-dx*.55+dz*(R()-.5)*CS*.8,fz=(z+.5+dz*.5)*CS-dz*.55+dx*(R()-.5)*CS*.8;\n   if(kind<.65)put(fx,FY[i]+.95,fz,dx*.28,1,dz*.28,0);   // propped against the wall\n   else{const yw=R()*6.28;put(fx-dx*.1,FY[i]+.36,fz-dz*.1,Math.cos(yw),.04,Math.sin(yw),0)}made++}}   // lying on the floor\n bodyM.count=headM.count=k;ropeM.count=ropes;scene.add(bodyM,headM,ropeM)}\n\n/* ---------- WEBS ---------- */\nconst WT=(()=>{const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d'),A=Math.PI/6;g.strokeStyle='rgba(255,255,245,1)';g.lineWidth=2.6;\n for(let a=0;a<12;a++){g.beginPath();g.moveTo(64,64);g.lineTo(64+Math.cos(a*A)*62,64+Math.sin(a*A)*62);g.stroke()}\n for(let r=10;r<62;r+=9){g.beginPath();for(let a=0
